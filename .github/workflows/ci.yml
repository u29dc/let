name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run util:format -- --check || bun run util:format

      - name: Lint
        run: bun run util:lint

      - name: Type check
        run: bun run util:types

      - name: Unit tests
        run: bun test --bail 50

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CLI binary
        run: bun run build:cli

      - name: Smoke test - tools
        run: |
          output=$(LET_JSON=1 bin/let tools --json 2>/dev/null)
          echo "$output" | jq -e '.ok == true'
          echo "$output" | jq -e '.data.tools | length > 0'

      - name: Smoke test - health
        run: |
          output=$(LET_JSON=1 bin/let health --json 2>/dev/null)
          echo "$output" | jq -e '.ok == true'
          echo "$output" | jq -e '.data.status'
