# Copy this file to $HOME/.tools/let/data/let.config.toml and customize
#
# =============================================================================
# SEARCH PARAMETERS
# =============================================================================

[search]
useApi = true  # false = skip Rightmove API and use HTML discovery directly
locations = [
    # { id = "REGION^1234", name = "City Name" },
    # { id = "REGION^5678", name = "Another City, County" },
]

[search.filters]
minBedrooms = 2
maxBedrooms = 3
minPrice = 700
maxPrice = 1300
# Valid types: detached, semi-detached, terraced, flat
propertyTypes = ["detached", "semi-detached", "terraced"]
includeLetAgreed = false
radius = 0
dontShow = ["houseShare", "retirement", "student"]
mustHave = ["garden"]

# =============================================================================
# FETCH SETTINGS
# =============================================================================

[fetch]
delayMs = 3000      # Delay between requests (avoid rate limiting)
maxListings = 100   # Max listings per search
maxRetries = 3      # Retry failed requests

# =============================================================================
# SCORECARDS
# =============================================================================

[scorecards.default]
label = "Baseline rental scorecard"

[scorecards.default.weights]
value = 0.20
property = 0.25
location = 0.20
dailyLife = 0.20
risk = 0.15

[scorecards.default.thresholds]
rentGoodPcm = 1450
rentHighPcm = 2200
depositWeeksGood = 5
depositWeeksHigh = 6
stationGoodMiles = 0.8
stationHighMiles = 2.5
broadbandGoodPct = 80
broadbandLowPct = 20
crimeLowPer1k = 40
crimeHighPer1k = 140
imdGoodDecile = 8
minPhotoCount = 6
targetBedrooms = 2
spaciousBedroomSqm = 32

[scorecards.default.caps]
partialEvidenceCap = 78
lowEvidenceCap = 62
blockerCap = 45

[scorecards.default.judgment]
enabled = true
blend = 0.5
maxAdjustment = 15
