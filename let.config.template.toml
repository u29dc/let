# Copy this file to data/let.config.toml and customize
#
# =============================================================================
# SEARCH PARAMETERS
# =============================================================================

[search]
locations = [
    # { id = "REGION^1234", name = "City Name" },
    # { id = "REGION^5678", name = "Another City, County" },
]

[search.filters]
minBedrooms = 2
maxBedrooms = 3
minPrice = 700
maxPrice = 1300
propertyTypes = ["detached", "semi-detached", "terraced"]
includeLetAgreed = false
radius = 0
dontShow = ["houseShare", "retirement", "student"]
mustHave = ["garden"]  # NOTE: noGarden penalty only applies when garden is in mustHave

# =============================================================================
# FETCH SETTINGS
# =============================================================================

[fetch]
useApi = false      # Use REST API for search (faster but may be blocked)
delayMs = 3000      # Delay between requests (avoid rate limiting)
maxListings = 100   # Max listings per search
maxRetries = 3      # Retry failed requests

# =============================================================================
# SCORING ENGINE
# =============================================================================
# Uses variance-adaptive aggregation:
# - Consistent scores -> geometric mean (requires all-around quality)
# - High variance -> arithmetic mean (allows compensation)

[scoring]
# How aggressively to allow high-scoring factors to compensate low ones
# 1.0 = conservative (mostly geometric mean, penalizes weakness)
# 2.0 = balanced (default)
# 4.0 = aggressive (mostly arithmetic mean at high variance)
adaptiveness = 2.0
# Scalar for sigmoid steepness
adaptivenessFactor = 10

[scoring.weights]
location = 0.40       # Station + broadband + region priority
affordability = 0.30  # Price percentile + EPC running costs
liveability = 0.30    # Garden + heating + property type

# Affordability composite configuration
# Note: Floor area removed from scoring - bedroom count implies reasonable size
[scoring.affordability]
priceWeight = 1.00      # Weight of true cost percentile (100%)
epcWeight = 0.00        # EPC captured via true cost; avoid double-counting

# Estimated monthly heating costs by EPC band (GBP)
# Used to calculate "true monthly cost" = rent + heating
[scoring.affordability.heatingCosts]
A = 30
B = 45
C = 70
D = 100
E = 400
F = 450
G = 500

# Location composite configuration
[scoring.location]
priorityWeight = 0.30   # Weight of region priority score
broadbandWeight = 0.25  # Weight of gigabit availability
stationWeight = 0.25    # Weight of station proximity
imdWeight = 0.12        # Weight of IMD decile
crimeWeight = 0.08      # Weight of crime rate percentile

# Liveability composite configuration
[scoring.liveability]
gardenWeight = 0.40       # Weight of garden type
heatingWeight = 0.30      # Weight of heating type
propertyTypeWeight = 0.30 # Weight of property type

# Garden type scores (0-100)
[scoring.liveability.garden]
private = 100
shared = 40
none = 0

# Heating type scores (0-100)
[scoring.liveability.heating]
gas = 100
electric = 60
unknown = 30

# Property type scores (0-100)
[scoring.liveability.propertyType]
detached = 95
house = 95
semi-detached = 90
terraced = 85
flat = 80
apartment = 80
cottage = 70
bungalow = 60
studio = 40

# Penalty multipliers for deal-breakers (0-1)
# Applied multiplicatively to final score
# Note: gardenRequired is automatically set based on mustHave containing "garden"
[scoring.penalties]
epcF = 0.00             # EPC F 100% penalty (uninhabitable)
epcG = 0.00             # EPC G 100% penalty (uninhabitable)
noGarden = 0.50         # No garden: 50% penalty - only applied when garden in mustHave
noPets = 0.90           # No pets: 10% penalty
missingDataPenalty = 0.95 # Per-missing-factor penalty multiplier

# Region priority scores (0-100)
# Rate each search region based on your personal preferences
# Higher scores = more desirable locations
[scoring.regionPriority]
# CityName = 90
# AnotherCity = 75
