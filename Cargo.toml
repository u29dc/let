[workspace]
members = ["crates/let-sdk", "crates/let-cli", "crates/let-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94.0"
version = "0.0.1"

[workspace.dependencies]
# Async runtime + concurrency
tokio = { version = "1.50.0", features = ["full"] }

# HTTP
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "json", "rustls", "stream"] }
url = "2.5.8"

# Serialization / config
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toon-format = { version = "0.5.0", default-features = false }
toml = "1.0.6"

# CLI and display
clap = { version = "4.6.0", features = ["derive", "env"] }

# TUI
crossterm = "0.29.0"
ratatui = "0.30.0"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm"] }
base64-simd = "0.8.0"

# Storage / parsing
rusqlite = { version = "0.39.0", features = ["bundled"] }
csv = "1.4.0"
zip = "8.2.0"
calamine = "0.34.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

# Errors + logging
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
dirs = "6.0.0"
secrecy = "0.10.3"
sha2 = "0.10.9"

# Tests
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3.27.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
