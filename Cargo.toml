[workspace]
members = ["crates/let-sdk", "crates/let-cli", "crates/let-tui"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.93.0"
version = "0.0.1"

[workspace.dependencies]
# Async runtime + concurrency
tokio = { version = "1.48.0", features = ["full"] }

# HTTP
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "brotli", "deflate", "gzip", "json", "rustls-tls", "stream"] }
url = "2.5.7"

# Serialization / config
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.8.23"

# CLI and display
clap = { version = "4.5.48", features = ["derive", "env"] }
comfy-table = "7.2.1"

# TUI
crossterm = "0.29.0"
ratatui = "0.29.0"

# Storage / parsing
rusqlite = { version = "0.37.0", features = ["bundled"] }
csv = "1.4.0"
zip = "6.0.0"
calamine = "0.31.0"

# Errors + logging
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
dirs = "6.0.0"
secrecy = "0.10.3"
sha2 = "0.10.9"

# Tests
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.22.0"
wiremock = "0.6.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
incremental = false
